<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-label="A ferret in a trash can pulls out a scrap labeled subfinder. The door only says whisker.">
  <rect width="1100" height="420" fill="#16130f"/>
  <rect x="0" y="330" width="1100" height="90" fill="#221c16"/>
  <text x="48" y="62" fill="#f4efe6" font-family="Georgia, serif" font-size="42">ferret-den</text>
  <text x="48" y="96" fill="#c9b8a2" font-family="ui-sans-serif, sans-serif" font-size="16">the agent sees whisker. the trash has the other name.</text>
  <g transform="translate(620,70)">
    <rect x="0" y="40" width="250" height="250" rx="8" fill="#2a241c" stroke="#8a7358" stroke-width="6"/>
    <rect x="20" y="18" width="210" height="28" rx="6" fill="#3a3228" stroke="#8a7358" stroke-width="4"/>
    <path d="M40 90 h170 M40 140 h170 M40 190 h170" stroke="#3d342a" stroke-width="8"/>
    <ellipse cx="126" cy="168" rx="78" ry="36" fill="#c47a3a"/>
    <ellipse cx="168" cy="150" rx="34" ry="22" fill="#e7c39a"/>
    <circle cx="182" cy="146" r="4" fill="#1b140e"/>
    <path d="M40 176 q-28 10 -18 34" fill="none" stroke="#c47a3a" stroke-width="14" stroke-linecap="round"/>
    <path d="M78 196 q-36 28 -8 48" fill="none" stroke="#c47a3a" stroke-width="10" stroke-linecap="round"/>
    <rect x="18" y="188" width="92" height="58" rx="4" fill="#f7f1e6" transform="rotate(-18 64 217)"/>
    <text x="34" y="224" fill="#1b140e" font-family="ui-monospace, monospace" font-size="14" transform="rotate(-18 64 217)">subfinder</text>
    <text x="78" y="78" fill="#f4efe6" font-family="ui-sans-serif, sans-serif" font-size="13">trash</text>
  </g>
  <g transform="translate(300,150)">
    <rect width="220" height="180" rx="6" fill="#2c261f" stroke="#d7c3a5" stroke-width="4"/>
    <circle cx="196" cy="96" r="7" fill="#c45c26"/>
    <text x="24" y="78" fill="#f4efe6" font-family="ui-monospace, monospace" font-size="22">den:whisker</text>
    <text x="24" y="112" fill="#c9b8a2" font-family="ui-sans-serif, sans-serif" font-size="14">finds subdomains</text>
    <text x="24" y="150" fill="#8a7358" font-family="ui-sans-serif, sans-serif" font-size="13">binary name not listed</text>
  </g>
  <text x="48" y="390" fill="#8a7358" font-family="ui-sans-serif, sans-serif" font-size="14">confirm: true still gates the bite. the rename is not the lock.</text>
</svg>
